# Config as code for Railway — static SPA after Vite build.
# Dashboard: set this service Root Directory to "client".
# Set VITE_API_URL and VITE_WS_URL to your *public* API URLs before deploy (build-time).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Static SPA — no database. Overrides any shared/API preDeploy (e.g. prisma db push).
preDeployCommand = "echo miapitza-web: no pre-deploy"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Config as code for Railway (https://docs.railway.com/config-as-code)
# Dashboard: set this service Root Directory to "server".

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

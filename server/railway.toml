# Use when Railway Root Directory is "server" (Dockerfile in this folder).
# If Root Directory is empty, the repo-root Dockerfile + railway.toml apply instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["npx prisma db push"]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

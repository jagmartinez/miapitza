# Railway / Nixpacks: backend lives in server/ — set Root Directory to "server" in Railway.
# NODE_ENV=production skips devDependencies by default; we need them for tsc + prisma CLI at build time.

providers = ["node"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

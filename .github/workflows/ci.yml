name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  biometric-provider:
    name: Biometric Provider Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biometric-provider
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            biometric-provider/requirements.txt
            biometric-provider/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --strict --vulnerability-service osv --timeout 30

      - name: Download and verify pinned models
        run: python scripts/fetch_models.py

      - name: Lint
        run: python -m ruff check app tests scripts

      - name: Unit, model and coverage tests
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing

      - name: Build production image
        run: docker build --target final --tag mia-face-provider:ci .

  server:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  server-integration:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    needs: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare integration env file
        run: |
          cat <<'EOF' > .env.test
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/restaurant_ci_test
          JWT_SECRET=ci-test-secret
          NODE_ENV=test
          EOF

      - name: Run integration tests
        run: npm run test:integration

      - name: Run local operational release harness
        env:
          RELEASE_HARNESS_ALLOW_LOCAL: "true"
        run: npm run test:release-harness -- --requests 150 --concurrency 12 --soak-ms 3000

  client:
    name: Client Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  client-e2e:
    name: Client E2E
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

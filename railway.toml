# Monorepo API: build from repo root. Leave "Root Directory" empty in Railway.
# Railway uses Dockerfile when present (avoids Railpack "build plan" errors on repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Schema sync runs in docker-entrypoint.sh when DATABASE_URL is available (not in preDeploy).
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

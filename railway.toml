# Monorepo API: build from repo root. Leave "Root Directory" empty in Railway.
# Railway uses Dockerfile when present (avoids Railpack "build plan" errors on repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["npx prisma db push --accept-data-loss"]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

services:
  db:
    image: mysql:8.0
    container_name: restaurant_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (see .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurante}
      MYSQL_USER: ${MYSQL_USER:-restaurant_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (see .env.example)}
    ports:
      # Local diagnostics only; do not expose MySQL on every host interface.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (see .env.example)}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: restaurant_server
    restart: always
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - storage_data:/app/storage
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-restaurant_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (see .env.example)}@db:3306/${MYSQL_DATABASE:-restaurante}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (see .env.example)}
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:?TWO_FA_ENCRYPTION_KEY is required (see .env.example)}
      HR_FACE_PROVIDER: ${HR_FACE_PROVIDER:-disabled}
      HR_ALLOW_FAKE_FACE_PROVIDER: ${HR_ALLOW_FAKE_FACE_PROVIDER:-false}
      HR_FACE_PROVIDER_BASE_URL: ${HR_FACE_PROVIDER_BASE_URL:-}
      HR_FACE_PROVIDER_TOKEN: ${HR_FACE_PROVIDER_TOKEN:-}
      HR_FACE_PROVIDER_MODEL: ${HR_FACE_PROVIDER_MODEL:-}
      HR_FACE_PROVIDER_VERSION: ${HR_FACE_PROVIDER_VERSION:-}
      HR_FACE_PROVIDER_TIMEOUT_MS: ${HR_FACE_PROVIDER_TIMEOUT_MS:-5000}
      HR_FACE_PROVIDER_ALLOW_HTTP_INTERNAL: ${HR_FACE_PROVIDER_ALLOW_HTTP_INTERNAL:-false}
      HR_BIOMETRIC_ENCRYPTION_KEY: ${HR_BIOMETRIC_ENCRYPTION_KEY:-}
      PLATFORM_TENANCY_MODE: ${PLATFORM_TENANCY_MODE:-single}
      PLATFORM_ADMIN_COMPANY_ID: ${PLATFORM_ADMIN_COMPANY_ID:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DOCS_USER: ${DOCS_USER:-admin}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
      BACKUP_ADMIN_COMPANY_ID: ${BACKUP_ADMIN_COMPANY_ID:-}
      STORAGE_DIR: /app/storage
      STORAGE_SHARED_ID: ${STORAGE_SHARED_ID:?STORAGE_SHARED_ID is required (see .env.example)}
      PEDIDOSYA_HTTP_TIMEOUT_MS: ${PEDIDOSYA_HTTP_TIMEOUT_MS:-8000}
      READINESS_DB_TIMEOUT_MS: ${READINESS_DB_TIMEOUT_MS:-2000}
      READINESS_STORAGE_TIMEOUT_MS: ${READINESS_STORAGE_TIMEOUT_MS:-2000}
      READINESS_BIOMETRIC_TIMEOUT_MS: ${READINESS_BIOMETRIC_TIMEOUT_MS:-2000}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  face-provider:
    profiles: ["biometrics"]
    build:
      context: ./biometric-provider
      dockerfile: Dockerfile
      target: final
    container_name: restaurant_face_provider
    restart: always
    ports:
      - "127.0.0.1:${FACE_PROVIDER_PORT:-8081}:8080"
    environment:
      FACE_ENV: production
      FACE_AUTH_TOKENS: ${HR_FACE_PROVIDER_TOKEN:-}
      FACE_TEMPLATE_ENCRYPTION_KEY: ${FACE_TEMPLATE_ENCRYPTION_KEY:-}
      FACE_IDENTIFIER_HASH_KEY: ${FACE_IDENTIFIER_HASH_KEY:-}
      FACE_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-restaurant_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (see .env.example)}@db:3306/${MYSQL_DATABASE:-restaurante}
      FACE_MODELS_DIR: /app/models
      FACE_WORKERS: ${FACE_WORKERS:-1}
      FACE_MAX_CONCURRENCY: ${FACE_MAX_CONCURRENCY:-1}
      FACE_QUEUE_TIMEOUT_SECONDS: ${FACE_QUEUE_TIMEOUT_SECONDS:-0.5}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    container_name: restaurant_client
    restart: always
    ports:
      # The runtime image serves the SPA on 8080; CLIENT_PORT is the host port.
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      server:
        condition: service_healthy

# See .env.example for required environment variables

volumes:
  db_data:
  storage_data:

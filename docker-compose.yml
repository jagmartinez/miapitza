services:
  db:
    image: mysql:8.0
    container_name: restaurant_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (see .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurante}
      MYSQL_USER: ${MYSQL_USER:-restaurant_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (see .env.example)}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (see .env.example)}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: restaurant_server
    restart: always
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-restaurant_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (see .env.example)}@db:3306/${MYSQL_DATABASE:-restaurante}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (see .env.example)}
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:?TWO_FA_ENCRYPTION_KEY is required (see .env.example)}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DOCS_USER: ${DOCS_USER:-admin}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    container_name: restaurant_client
    restart: always
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - server

# See .env.example for required environment variables

volumes:
  db_data:
